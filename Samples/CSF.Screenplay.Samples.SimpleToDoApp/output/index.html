<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-do list</title>
  <script type="module" crossorigin src="/assets/main-Dq_VN0Hp.js"></script>
</head>
<body>
<h1>To-do list</h1>
<section id="editor">
    <h2>Editor</h2>
    <fieldset class="item_properties">
        <div class="field">
            <label for="ItemName">Summary</label>
            <input type="text" id="ItemName">
        </div>
        <div class="field">
            <label for="ItemDetail">Detail</label>
            <textarea id="ItemDetail"></textarea>
        </div>
        <div class="field">
            <label for="ItemPriority">Priority</label>
            <select id="ItemPriority"></select>
        </div>
        <div class="field">
            <label for="ItemCompleted">Completed date</label>
            <input type="date" id="ItemCompleted">
        </div>
    </fieldset>
    <fieldset class="controls">
        <button id="DeleteItem">Delete</button>
        <div class="button_group">
            <button id="NewItem">New</button>
            <button id="SaveItem">Save</button>
        </div>
    </fieldset>
</section>
<section id="item_listing">
    <h2>Things to do</h2>
    <ol id="items_list"></ol>
</section>
<template id="item_template">
<li>
    <h3>Name</h3>
    <div class="detail">Detail</div>
    <label class="priority">Priority</label>
    <label class="completed">Completed</label>
    <aside class="controls">
        
    </aside>
</li>
</template>
</body>
</html>
